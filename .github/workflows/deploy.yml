name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: backend-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -az --delete --exclude=".git/" --exclude="node_modules/" --exclude="dist/" --exclude="__pycache__/" --exclude=".venv/" --exclude="*.db"
          remote_path: /opt/odr-v2
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: root
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,ADMIN_PASSWORD,SMTP_HOST,SMTP_USER,SMTP_PASSWORD
          script: |
            cd /opt/odr-v2
            export POSTGRES_PASSWORD JWT_SECRET ADMIN_PASSWORD SMTP_HOST SMTP_USER SMTP_PASSWORD
            docker compose up -d --build
            docker compose ps
            sleep 10
            curl -sf http://localhost:8080/api/v1/health && echo " deploy-ok" || echo " deploy-failed"
